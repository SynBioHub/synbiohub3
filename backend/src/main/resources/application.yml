server:
  port : 6789
  tomcat:
    relaxed-path-chars: ['<','>']
    relaxed-query-chars: ['<','>']
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./data/sbhdb
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
      use-new-id-generator-mappings: false
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
logging:
  file:
    path: ./data
synbiohub:
  firstLaunch: true
plugin:
  external:
    testserver:
      login: http://localhost:8104/loggedinAPI
      logout: http://localhost:8104/logoutAPI
      refresh: http://localhost:8104/refresh
      status: http://localhost:8104/status

jwt:
  # RSA app.priv/app.pub were for unused Spring JwtEncoder/Decoder (removed). Live JWTs use jwtSecret (HS256) in config.local.json.
  # private.key / public.key can be restored with NimbusJwtEncoder/Decoder if needed.

springdoc:
  swagger-ui:
    path: /swagger-ui.html

